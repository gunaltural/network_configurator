name: Scratch Cisco BGP multi-CLI evidence learning (research only)
on:
  pull_request:
    paths:
      - 'research/network_lm/cisco_bgp/**'
      - '.github/workflows/network-lm-multicli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-scratch-multicli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed, CPU-only PyTorch
        run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify CLI evidence, role abstraction and training/heldout boundaries
        run: python -m unittest research.network_lm.cisco_bgp.test_multicli_lm research.network_lm.cisco_bgp.test_multicli_abstraction -v
      - name: Teach original random-init BGP Transformer for 800 updates (seed 42)
        run: |
          python -m research.network_lm.cisco_bgp.multicli_lm \
            --steps 800 --width 96 --layers 2 --heads 4 \
            --seed 42 --context 512 --vocab-size 512 \
            --output /tmp/bgp-cli-evidence-seed42.pt
      - name: Train identical scratch architecture with peer/prefix identity abstraction (seed 42)
        run: |
          python -m research.network_lm.cisco_bgp.multicli_lm \
            --abstract-identities --steps 800 --width 96 --layers 2 --heads 4 \
            --seed 42 --context 512 --vocab-size 512 \
            --output /tmp/bgp-cli-abstract-seed42.pt
      - name: Repeat abstracted scratch training independently (seed 7)
        run: |
          python -m research.network_lm.cisco_bgp.multicli_lm \
            --abstract-identities --steps 800 --width 96 --layers 2 --heads 4 \
            --seed 7 --context 512 --vocab-size 512 \
            --output /tmp/bgp-cli-abstract-seed7.pt
      - name: Test generated findings against alternate IOS XE CLI and no-learning reference
        run: |
          python - <<'PY'
          import json
          runs=[
              ('RAW_SEED42','/tmp/bgp-cli-evidence-seed42.metrics.json'),
              ('ABSTRACT_SEED42','/tmp/bgp-cli-abstract-seed42.metrics.json'),
              ('ABSTRACT_SEED7','/tmp/bgp-cli-abstract-seed7.metrics.json'),
          ]
          reports=[]
          for name,path in runs:
              m=json.load(open(path))
              old=m['heldout_generation']
              v2=m['new_alternate_cli_generation']
              assert m['status']=='CISCO_BGP_MULTI_CLI_GENERATIVE_RESEARCH_ONLY'
              assert m['engineering_verified'] is False and m['production_ready'] is False
              assert m['train_samples']==240 and m['val_samples']==56
              assert old['total']==v2['total']==m['test_samples']==96
              assert m['majority_reference_correct']==12
              assert old['paired_contrasts']['total']==v2['paired_contrasts']['total']==36
              assert all(x['total']==12 for x in v2['by_kind'].values())
              assert m['deterministic_algorithms'] is True and m['steps']==800
              reports.append(m)
              print('SCRATCH_BGP_ALTCLI',name,
                    'raw_test_finding',old['finding_correct'],'/96',
                    'ALT_CLI_Finding',v2['finding_correct'],'/96',
                    'ALT_CLI_Full_explanation',v2['exact_explanation'],'/96',
                    'ALT_CLI_pair_both',v2['paired_contrasts']['both_correct'],'/36',
                    'ALT_CLI_pair_changed',v2['paired_contrasts']['prediction_changed'],'/36',
                    'majority_reference',m['majority_reference_correct'],'/96',
                    'ALT_CLI_by_kind',v2['by_kind'],
                    'ALT_CLI_first_sample',v2['first_samples'][:1])
          raw,a42,a7=reports
          assert raw['abstract_identities'] is False
          assert a42['abstract_identities'] and a7['abstract_identities']
          for m in reports[1:]:
              assert m['configuration']==raw['configuration']
              assert m['new_alternate_cli_sha256']==raw['new_alternate_cli_sha256']
              assert m['steps']==raw['steps']
          for key in ('training_sha256','validation_sha256',
                      'heldout_sha256','tokenizer_sha256','parameter_count'):
              assert a42[key]==a7[key],f'Uncontrolled training seed comparison: {key}'
          print('ABSTRACTED_TWO_SEED_AVERAGE_ALT_CLI_FINDING',
                (a42['new_alternate_cli_generation']['finding_correct']
                 +a7['new_alternate_cli_generation']['finding_correct'])/2,
                '/96; strict exact full explanation independently above.')
          PY
      - name: Preserve research metrics only - never deploy to Render
        uses: actions/upload-artifact@v4
        with:
          name: research-cisco-bgp-multicli-evidence-metrics-not-production
          path: |
            /tmp/bgp-cli-evidence-*.metrics.json
            /tmp/bgp-cli-abstract-*.metrics.json
          retention-days: 14
          if-no-files-found: error
