name: AI Analysis reasoning MVP checks

on:
  pull_request:
    paths:
      - 'engineering_ai.py'
      - 'engineering_knowledge.py'
      - 'analysis-ui.js'
      - 'analysis.html'
      - 'test_engineering_ai.py'
      - 'test_engineering_knowledge.py'
      - '.github/workflows/ai-analysis-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal Python dependencies
        run: python -m pip install 'fastapi>=0.110' 'httpx>=0.27'
      - name: Validate model review and knowledge retrieval
        run: python -m unittest -v test_engineering_ai test_engineering_knowledge
      - name: Validate browser JavaScript syntax
        run: node --check analysis-ui.js && node --check show-analysis.js
      - name: Install browser DOM test dependency
        run: npm install --no-save --ignore-scripts jsdom@30.1.1
      - name: Validate CLI parsing and large-capture batching
        run: node test_show_analysis.cjs && node test_show_analysis_large_capture.cjs
