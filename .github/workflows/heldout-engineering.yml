name: Held-out engineering observations
on:
  pull_request:
    paths:
      - "evaluation/heldout/**"
      - ".github/workflows/heldout-engineering.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        tech: [BGP, MLAG, STP, SDWAN]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application test dependencies
        run: python -m pip install fastapi httpx httpx2
      - name: Verify raw TAC evidence correlation
        run: python -m unittest test_bgp_cli_evidence -v
      - name: Verify official evaluation weights
        run: |
          curl --fail --location --retry 2 --output /tmp/model.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/model.gguf" | sha256sum -c -
      - name: Run local inference with synthetic CLI evidence
        env:
          PYTHONPATH: .
          AI_ENABLED: "1"
          AI_PROVIDER: local
          AI_MODEL: network-engineer
          AI_BASE_URL: http://127.0.0.1:18081/v1
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
          image=$(docker image inspect ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389 --format '{{index .RepoDigests 0}}')
          echo "Runtime: $image"
          docker run -d --name local-inference -p 127.0.0.1:18081:8080 -v /tmp/model.gguf:/models/model.gguf:ro "$image" -m /models/model.gguf --alias network-engineer --host 0.0.0.0 --port 8080 --ctx-size 16384 --parallel 1
          trap 'docker stats --no-stream local-inference; docker rm -f local-inference' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/health
          python evaluation/heldout/run.py "${{ matrix.tech }}"
