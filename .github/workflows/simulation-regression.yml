name: Simulation regression
on:
  pull_request:
    paths:
      - "simulation/**"
      - "Dockerfile"
      - "synthetic-bgp.js"
      - "bgp-traffic-policy.js"
      - "test_bgp_traffic_policy.cjs"
      - "test_bgp_traffic_browser.mjs"
      - "config-compare.js"
      - "synthetic-lab.js"
      - "network-lab.html"
      - "network-discovery.js"
      - "test_discovery_resize.cjs"
      - "test_discovery_port_transfer_browser.mjs"
      - "test_implementation_modules_browser.mjs"
      - "simulation-report.js"
      - "engineering_ai.py"
      - "test_engineering_ai.py"
      - "simulation-workbench.js"
      - "simulation_report.py"
      - "corporate-shell.js"
      - "corporate-theme.css"
      - "design-checks.js"
      - "web.html"
      - "reporting.html"
      - "deliverables.html"
      - "deliverables.js"
      - "project-library.js"
      - "test_deliverables_browser.mjs"
      - "test_reporting.cjs"
      - "test_unified_reporting.cjs"
      - "test_simulation_report.py"
      - "network_lab.py"
      - "app.py"
      - "project-workflow.js"
      - "workspace-storage.js"
      - "test_workspace_storage*"
      - "test_project_context*"
      - "test_stp_root*"
      - "test_catalyst_campus*"
      - "test_report_review*"
      - "test_project_workflow*"
      - "port-mapping*"
      - "port_mapping.py"
      - "samples/port-mapping/**"
      - "network_discovery.py"
      - "discovery_details.py"
      - "test_port_mapping*"
      - "authentication.py"
      - ".github/workflows/render-live-verification.yml"
      - ".github/workflows/simulation-regression.yml"
  push:
    branches: ["feature/vendor-failure-simulation-v5-44", "fix/v5-44-2-simulation-docker-packaging", "feature/render-live-deployment-verification", "main"]
jobs:
  simulation-and-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx2
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: AI service and authentication regression
        run: python -m unittest test_engineering_ai -v
      - name: MAC port mapping regression
        env:
          AUTH_ENABLED: '0'
        run: node test_port_mapping.cjs && node test_port_mapping_topology.cjs && node test_port_mapping_support.cjs && python -m unittest test_port_mapping_api test_network_discovery test_discovery_features -q && node test_discovery_resize.cjs
      - name: Syntax check modules
        run: |
          node --check simulation/vendor-failure-engine.mjs
          node --check simulation/simulation-vpc-link.js
          node --check simulation/vendor-failure-engine.test.mjs
          node --check simulation/test_bgp_end_to_end.mjs
          node --check simulation/test_mlag_ui.mjs
          node --check synthetic-bgp.js
          python -m py_compile app.py network_lab.py
      - name: Simulation engine and UI regression
        run: node --test simulation/test_audit_regressions.mjs simulation/test_bgp_report.mjs simulation/vendor-failure-engine.test.mjs simulation/test_bgp_end_to_end.mjs simulation/test_mlag_ui.mjs
      - name: Preserved BGP client simulation and report API
        env:
          AUTH_ENABLED: '0'
        run: |
          node test_synthetic_bgp.cjs
          node test_bgp_traffic_policy.cjs
          node test_engineering_report.cjs
          python -m unittest test_simulation_report test_authentication -q
      - name: Shared module simulation engine and actual DOM transfers
        run: node simulation/test_protocol_report.cjs && node simulation/test_workspace_engine.cjs && node simulation/test_pair_behavior.cjs && node simulation/test_workspace_dom.cjs
      - name: Workspace integration and full existing regression suite
        run: npm test
      - name: Route and dynamic topology contract tests
        env:
          AUTH_ENABLED: '0'
        run: python -m unittest discover -s simulation -p 'test_*.py'
      - name: Chromium end-to-end Workspace and Simulator smoke
        env:
          AUTH_ENABLED: '0'
          SMOKE_URL: http://127.0.0.1:8125
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8125 > /tmp/nc-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8125/healthz >/dev/null; then break; fi
            sleep 1
          done
          node test_workspace_storage.cjs
          node test_workspace_storage_browser.mjs
          node test_project_context_browser.mjs
          node test_stp_root_browser.mjs
          node test_catalyst_campus_browser.mjs
          node test_deliverables_browser.mjs
          node test_report_review_browser.mjs
          node test_project_workflow_browser.mjs
          node test_quick_design_browser.mjs
          TRANSITION_QUOTA=1 node test_module_report_transition_browser.mjs
          node test_bgp_traffic_browser.mjs
          node test_port_mapping_browser.mjs
          node test_discovery_port_transfer_browser.mjs
          node test_implementation_modules_browser.mjs
          node simulation/test_browser_smoke.mjs
          node simulation/test_workspace_browser.mjs
          node simulation/test_pair_browser.mjs
          node simulation/test_report_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-browser-smoke
          path: |
            /tmp/shared-vpc-simulation.png
            /tmp/cisco-vpc-peer-link-down.png
            /tmp/cisco-vpc-split-brain.png
            /tmp/visual-*.png
            /tmp/bgp-browser-smoke.png
            /tmp/bgp-design-traffic-*.png
            /tmp/catalyst-campus-*.png
            /tmp/bgp-restored-parameters.png
            /tmp/bgp-connection-policies.png
            /tmp/port-topology-*.png
            /tmp/port-support-topology.png
            /tmp/deliverables-*.png
            /tmp/discovery-layout-*.png
          if-no-files-found: ignore

  production-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production Docker image
        run: docker build -t nc-production-smoke .
      - name: Test runtime routes from production image
        run: |
          docker run -d --name nc-smoke -e AUTH_ENABLED=0 -p 127.0.0.1:18080:10000 nc-production-smoke
          trap 'docker logs nc-smoke; docker rm -f nc-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz | python -c 'import json,sys; p=json.load(sys.stdin); assert p["ok"] is True and p["simulator_ready"] is True; assert p["version"]=="5.57.6", p'
          curl --fail --silent --show-error http://127.0.0.1:18080/deliverables | python -c 'import sys; assert "deliverablesCenter" in sys.stdin.read()'
          curl --fail --silent --show-error http://127.0.0.1:18080/deliverables.js | python -c 'import sys; assert "openSaved" in sys.stdin.read()'
          curl --fail --silent --show-error http://127.0.0.1:18080/workspace-storage.js | python -c 'import sys; p=sys.stdin.read(); assert "NetworkWorkspaceStorage" in p and "NC-LZW1" in p'
          curl --fail --silent --show-error http://127.0.0.1:18080/bgp-traffic-policy.js | python -c 'import sys; p=sys.stdin.read(); assert "BgpTrafficPolicy" in p and "bgp-policy-line-head" in p'
          curl --fail --silent --show-error http://127.0.0.1:18080/ | python -c 'import sys; p=sys.stdin.read(); assert "bgpLegacyLayout" in p and "bgpOutboundTeCard" in p and "bgpAddTrafficPolicy" in p and "bgpAddInboundPolicy" in p and "bgpTab-traffic" not in p'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/port-mapping/samples | python -c 'import json,sys; p=json.load(sys.stdin); assert p["synthetic"] is True and len(p["files"])==2; assert all("SYNTHETIC DEMONSTRATION ONLY" in f["text"] for f in p["files"])'
          curl --fail --silent --show-error http://127.0.0.1:18080/port-mapping | python -c 'import sys; assert "pmSupportCoverage" in sys.stdin.read()'
          curl --fail --silent --show-error http://127.0.0.1:18080/port-mapping-sample.zip | python -c 'import sys,io,zipfile; z=zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read())); assert len(z.namelist())==3; assert b"SYNTHETIC DEMONSTRATION ONLY" in z.read("CORE-01-show-tech-support.txt")'
          curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"sources":[{"id":"smoke","device":"CORE","platform":"Cisco IOS-XE","kind":"lldp","raw":"Local Intf: Gi1/0/1\nChassis id: 0011.2233.4455\nPort id: Gi1/0/48\nSystem Name: ACCESS","importedAt":"2026-10-19T15:00:00Z"}]}' http://127.0.0.1:18080/api/port-mapping/analyze | python -c 'import json,sys; p=json.load(sys.stdin); assert len(p["graph"]["links"])==1, p'
          curl --fail --silent --show-error http://127.0.0.1:18080/vpc-mlag-simulation | grep -q 'Technology Workspace topology'
          curl --fail --silent --show-error http://127.0.0.1:18080/simulation/vendor-failure-engine.mjs | grep -q 'analyzeAccessImpact'
          curl --fail --silent --show-error http://127.0.0.1:18080/synthetic-bgp.js | grep -q 'SyntheticBGP'
          echo "Production container: vPC/MLAG and BGP endpoint smoke passed"
