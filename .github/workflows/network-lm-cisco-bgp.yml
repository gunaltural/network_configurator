name: Scratch Cisco BGP learning (independent research)
on:
  pull_request:
    paths:
      - 'research/network_lm/cisco_bgp/**'
      - '.github/workflows/network-lm-cisco-bgp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cisco-bgp-student:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated scratch training dependency
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm split isolation, eight classes and real gradient updates
        run: python -m unittest research.network_lm.cisco_bgp.test_experiment research.network_lm.cisco_bgp.test_language research.network_lm.cisco_bgp.test_tokenizer research.network_lm.cisco_bgp.test_summarize_language -v
      - name: Retain max-pooling BGP state baseline (independent of generative LM)
        run: |
          python -m research.network_lm.cisco_bgp.experiment \
            --steps 600 --per-class 48 --batch-size 8 --seed 42 \
            --pooling max --output /tmp/cisco-bgp-max42.pt
      - name: Summarize genuinely unseen BGP status tests and strict pair contrasts
        run: |
          python - <<'PY'
          import json
          for mode in ('max',):
              d = json.load(open(f'/tmp/cisco-bgp-{mode}42.metrics.json'))
              assert d['heldout']['total'] == 32
              assert d['fresh_acceptance_v2']['total'] == 32
              assert d['counterfactual']['total'] == 4
              assert d['production_ready'] is False
              assert d['engineering_verified'] is False
              print(f"SCRATCH_CISCO_BGP mode={mode} seed=42: unseen {d['heldout']['correct']}/32, "
                    f"NEW frozen {d['fresh_acceptance_v2']['correct']}/32, "
                    f"counterfactual {d['counterfactual']['correct']}/4")
              print("MISCLASSIFICATIONS:", [
                  x for x in d['heldout']['predictions'] if not x['correct']
              ])
          PY
      - name: Compare scratch causal BGP model capacity with fixed train-only BPE
        run: |
          python -m research.network_lm.cisco_bgp.language \
            --steps 900 --per-class 48 --batch-size 8 --seed 42 --data-seed 42 \
            --tokenizer bpe --bpe-vocab-size 448 \
            --width 64 --layers 2 --heads 4 \
            --output /tmp/cisco-bgp-language-bpe-small42.pt
          python -m research.network_lm.cisco_bgp.language \
            --steps 900 --per-class 48 --batch-size 8 --seed 42 --data-seed 42 \
            --tokenizer bpe --bpe-vocab-size 448 \
            --width 128 --layers 3 --heads 4 \
            --output /tmp/cisco-bgp-language-bpe-large42.pt
          python -m research.network_lm.cisco_bgp.language \
            --steps 900 --per-class 48 --batch-size 8 --seed 7 --data-seed 42 \
            --tokenizer bpe --bpe-vocab-size 448 \
            --width 128 --layers 3 --heads 4 \
            --output /tmp/cisco-bgp-language-bpe-large7.pt
          python -m research.network_lm.cisco_bgp.language \
            --steps 900 --per-class 48 --batch-size 8 --seed 99 --data-seed 42 \
            --tokenizer bpe --bpe-vocab-size 448 \
            --width 128 --layers 3 --heads 4 \
            --output /tmp/cisco-bgp-language-bpe-large99.pt
      - name: Enforce real generated-answer evaluation and publish negative results
        run: |
          python - <<'PY'
          import json
          for mode, path in (
              ("bpe-64x2", "/tmp/cisco-bgp-language-bpe-small42.metrics.json"),
              ("bpe-128x3-seed42", "/tmp/cisco-bgp-language-bpe-large42.metrics.json"),
              ("bpe-128x3-seed7", "/tmp/cisco-bgp-language-bpe-large7.metrics.json"),
              ("bpe-128x3-seed99", "/tmp/cisco-bgp-language-bpe-large99.metrics.json"),
          ):
              report=json.load(open(path))
              reused=report["heldout_generation"]
              fresh=report["fresh_acceptance_v2"]
              newest=report["fresh_acceptance_v3"]
              assert reused["heldout_cases"]==fresh["heldout_cases"]==newest["heldout_cases"]==32
              assert report["engineering_verified"] is False
              assert report["production_ready"] is False
              assert report["status"]=="CISCO_BGP_CAUSAL_LM_SCRATCH_ONLY"
              print("REAL_SCRATCH_LANGUAGE_MODEL:", mode,
                    "reused state",reused["state_correct"],"reused full",reused["full_format_correct"],
                    "v2 state",fresh["state_correct"],"v2 full",fresh["full_format_correct"],
                    "v3 state",newest["state_correct"],"v3 full",newest["full_format_correct"],
                    "parameter_count",report["parameter_count"],
                    "mean prompt tokens",report["train_mean_prompt_tokens"],
                    "vocab",report["architecture"]["vocab_size"],
                    "dev token loss (NOT comparable across tokenizers)",report["dev_token_loss_after"])
              print("NEW_GENERATION_SAMPLES:",fresh["cases"][:3])
          PY
      - name: Require strictly comparable multi-seed language metrics
        run: |
          python -m research.network_lm.cisco_bgp.summarize_language \
            /tmp/cisco-bgp-language-bpe-large42.metrics.json \
            /tmp/cisco-bgp-language-bpe-large7.metrics.json \
            /tmp/cisco-bgp-language-bpe-large99.metrics.json \
            --output /tmp/cisco-bgp-language-multiseed.metrics.json
      - name: Keep research metrics only, not live application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisco-bgp-scratch-research-metrics
          path: /tmp/cisco-bgp-*.metrics.json
          retention-days: 14
          if-no-files-found: error
