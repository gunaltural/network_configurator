name: Scratch Cisco BGP learning (independent research)
on:
  pull_request:
    paths:
      - 'research/network_lm/cisco_bgp/**'
      - '.github/workflows/network-lm-cisco-bgp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cisco-bgp-student:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated scratch training dependency
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm split isolation, eight classes and real gradient updates
        run: python -m unittest research.network_lm.cisco_bgp.test_experiment research.network_lm.cisco_bgp.test_language -v
      - name: Controlled experiment on identical Cisco BGP training data
        run: |
          python -m research.network_lm.cisco_bgp.experiment \
            --steps 600 --per-class 48 --batch-size 8 --seed 42 \
            --pooling last --output /tmp/cisco-bgp-last42.pt
          python -m research.network_lm.cisco_bgp.experiment \
            --steps 600 --per-class 48 --batch-size 8 --seed 42 \
            --pooling mean --output /tmp/cisco-bgp-mean42.pt
          python -m research.network_lm.cisco_bgp.experiment \
            --steps 600 --per-class 48 --batch-size 8 --seed 42 \
            --pooling max --output /tmp/cisco-bgp-max42.pt
      - name: Summarize genuinely unseen BGP status tests and strict pair contrasts
        run: |
          python - <<'PY'
          import json
          for mode in ('last','mean','max'):
              d = json.load(open(f'/tmp/cisco-bgp-{mode}42.metrics.json'))
              assert d['heldout']['total'] == 32
              assert d['counterfactual']['total'] == 4
              assert d['production_ready'] is False
              assert d['engineering_verified'] is False
              print(f"SCRATCH_CISCO_BGP mode={mode} seed=42: unseen {d['heldout']['correct']}/32, "
                    f"counterfactual {d['counterfactual']['correct']}/4")
              print("MISCLASSIFICATIONS:", [
                  x for x in d['heldout']['predictions'] if not x['correct']
              ])
          PY
      - name: Train actual causal language model from random weights (NOT a status head)
        run: |
          python -m research.network_lm.cisco_bgp.language \
            --steps 900 --per-class 48 --batch-size 8 --seed 42 \
            --output /tmp/cisco-bgp-language-seed42.pt
      - name: Enforce real generated-answer evaluation and publish negative results
        run: |
          python - <<'PY'
          import json
          report=json.load(open("/tmp/cisco-bgp-language-seed42.metrics.json"))
          output=report["heldout_generation"]
          assert output["heldout_cases"]==32
          assert report["engineering_verified"] is False
          assert report["production_ready"] is False
          assert report["status"]=="CISCO_BGP_CAUSAL_LM_SCRATCH_ONLY"
          print("REAL_SCRATCH_LANGUAGE_MODEL:",
                "32-case correct BGP state",output["state_correct"],
                "complete conditional reviews",output["full_format_correct"],
                "heldout token loss",report["dev_token_loss_after"])
          print("UNSEEN_GENERATION_EXAMPLES:",output["cases"][:4])
          PY
      - name: Keep research metrics only, not live application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisco-bgp-scratch-research-metrics
          path: /tmp/cisco-bgp-*.metrics.json
          retention-days: 14
          if-no-files-found: error
