name: Local model inference and safety smoke (not engineering acceptance)
on:
  push:
    branches:
      - feature/ai-reasoning-mvp
    # Every feature-branch commit must produce a fresh real-model acceptance run.
    # Path filters previously allowed unrelated changes to leave HEAD without a gate.
  pull_request:
    paths:
      - ".github/workflows/local-model-evaluation.yml"
      - "scripts/evaluate_local_model.py"
      - "evaluation/heldout/**"
      - "ai-topology-workspace.js"
      - "test_ai_topology_workspace.cjs"
      - "engineering_ai.py"
      - "scripts/probe_groq_access.py"
      - "test_groq_access_probe.py"
      - "bgp_cli_evidence.py"
      - "test_bgp_cli_evidence.py"
      - "tac_overview.py"
      - "test_tac_overview.py"
      - "show-analysis.js"
      - "start_embedded_ai.py"
      - "Dockerfile"
      - "scripts/check_budget_analysis.py"
  workflow_dispatch:
# Avoid overlapping expensive model evaluations from successive automation pushes.
# Never cancel a newer run in favor of a stale SHA.
concurrency:
  group: real-model-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application test dependencies
        run: python -m pip install fastapi httpx
      - name: Verify isolated AI topology workspace contract
        run: node test_ai_topology_workspace.cjs
      - name: Verify raw TAC evidence correlation
        run: python -m unittest test_bgp_cli_evidence test_tac_overview -v
      - name: Verify official evaluation weights
        run: |
          curl --fail --location --retry 2 --output /tmp/model.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/model.gguf" | sha256sum -c -
      # The 0.5B model is a diagnostic baseline, not the engineering reasoning acceptance gate.
      # Its incomplete output remains visible in logs without masking the required 3B run.
      - name: Run local model transport and fail-closed checks with synthetic CLI
        continue-on-error: true
        env:
          PYTHONPATH: .
          AI_ENABLED: "1"
          AI_PROVIDER: local
          AI_MODEL: network-engineer
          AI_BASE_URL: http://127.0.0.1:18081/v1
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp:server
          image=$(docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{index .RepoDigests 0}}')
          echo "Runtime: $image"
          docker run -d --name local-inference -p 127.0.0.1:18081:8080 -v /tmp/model.gguf:/models/model.gguf:ro "$image" -m /models/model.gguf --alias network-engineer --host 0.0.0.0 --port 8080 --ctx-size 2048 --parallel 1
          trap 'docker stats --no-stream local-inference; docker rm -f local-inference' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/health
          python scripts/evaluate_local_model.py
          {
            echo "### Local model transport and safety smoke"
            echo "- A green CI result confirms the model endpoint and fail-closed behavior, not engineering accuracy."
            echo "- Responses labeled model-unverified-draft were **not** accepted as engineering findings."
            echo "- Independent hosted and stronger-model holdout acceptance remain separate release gates."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate app and inference under a shared free-tier-sized budget
        # 300 MB local-model OOM is known; diagnostic only, not a hosted-AI release gate.
        continue-on-error: true
        env:
          RUNTIME: ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
        run: |
          set -euo pipefail
          docker build --target app -t nc-budget-app .
          docker network create evaluation
          trap 'docker stats --no-stream nc-app nc-model || true; docker inspect --format "{{.Name}} OOM={{.State.OOMKilled}} exit={{.State.ExitCode}}" nc-app nc-model || true; docker rm -f nc-app nc-model || true; docker network rm evaluation || true' EXIT
          docker run -d --name nc-app --network evaluation --memory 180m --memory-swap 180m --cpus 0.04 -p 127.0.0.1:18100:10000 -e AUTH_ENABLED=0 -e AI_ENABLED=1 -e AI_MODEL=network-engineer -e AI_PROVIDER=local -e AI_BASE_URL=http://nc-model:8080/v1 nc-budget-app
          docker run -d --name nc-model --network evaluation --memory 300m --memory-swap 300m --cpus 0.06 -p 127.0.0.1:18081:8080 -v /tmp/model.gguf:/models/network.gguf:ro "$RUNTIME" -m /models/network.gguf --alias network-engineer --host 0.0.0.0 --port 8080 --ctx-size 2048 --parallel 1
          for i in $(seq 1 100); do
            for container in nc-app nc-model; do
              test "$(docker inspect -f '{{.State.Running}}' "$container")" = true || exit 1
            done
            if curl -fsS --max-time 3 http://127.0.0.1:18100/healthz >/dev/null && curl -fsS --max-time 3 http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:18081/health
          python scripts/check_budget_analysis.py

      - name: Single application image with bundled model, no external provider
        # Embedded inference is an experimental option, not the hosted V0.1 runtime.
        continue-on-error: true
        run: |
          docker build -t nc-embedded .
          docker run -d --name combined --memory 480m --memory-swap 480m --cpus 0.1 -p 127.0.0.1:18100:10000 -e AUTH_ENABLED=0 nc-embedded
          trap 'docker stats --no-stream combined; docker inspect --format "OOM={{.State.OOMKilled}} exit={{.State.ExitCode}}" combined; docker rm -f combined' EXIT
          for i in $(seq 1 100); do
            test "$(docker inspect -f '{{.State.Running}}' combined)" = true
            if docker exec combined python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:18081/health',timeout=3)" 2>/dev/null && curl -fsS http://127.0.0.1:18100/healthz >/dev/null; then break; fi
            sleep 2
          done
          python scripts/check_budget_analysis.py

  stronger-model-evaluation:
    # Optional manual diagnostic. Hosted GPT-OSS is the V0.1 reasoning acceptance gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        run: python -m pip install fastapi httpx
      - name: Download stronger Qwen2.5 3B GGUF
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --output /tmp/strong-model.gguf \
            https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
          test "$(stat -c %s /tmp/strong-model.gguf)" -gt 1000000000
          sha256sum /tmp/strong-model.gguf
      - name: Run real 3B model against existing synthetic engineering evaluation
        env:
          PYTHONPATH: .
          AI_ENABLED: "1"
          AI_PROVIDER: local
          AI_MODEL: network-engineer
          AI_BASE_URL: http://127.0.0.1:18081/v1
          AI_LOCAL_REASONING_PROFILE: full
        run: |
          set -euo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name strong-inference -p 127.0.0.1:18081:8080 \
            -v /tmp/strong-model.gguf:/models/model.gguf:ro \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/model.gguf --alias network-engineer --host 0.0.0.0 \
            --port 8080 --ctx-size 4096 --parallel 1 --threads 2
          trap 'docker logs --tail 50 strong-inference || true; docker stats --no-stream strong-inference || true; docker rm -f strong-inference || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/health
          python scripts/evaluate_local_model.py
          # Mandatory independent engineering-accuracy gate, not merely model availability.
          python evaluation/heldout/run.py BGP

  hosted-bgp-acceptance:
    # Run automatically on trusted feature-branch pushes with synthetic holdout only.
    # Never run with secrets on untrusted pull-request events.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install held-out evaluation dependencies
        run: python -m pip install fastapi httpx
      - name: Verify independent endpoint probe and safe diagnostics offline
        run: python -m unittest -v test_groq_access_probe
      - name: Test Groq account and model permission without customer evidence
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/probe_groq_access.py
      - name: Independently evaluate GPT-OSS 120B on synthetic BGP evidence
        env:
          PYTHONPATH: .
          AI_ENABLED: "1"
          AI_PROVIDER: groq
          AI_MODEL: openai/gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "GROQ_API_KEY GitHub Actions secret is not configured; no external model test ran."
            exit 1
          fi
          # Engineering correctness gates run sequentially on real model responses.
          # Never substitute mocked adapter checks for model acceptance.
          # The independent Cisco vPC holdout is the first mandatory reasoning gate.
          # It checks conditional peer-switch advice and operational peer-gateway / keepalive counter-evidence.
          # Collect every independent domain result even if VPC fails; a failed
          # suite must never turn the job green. No rubric is sent to the model.
          failed=0
          for suite in VPC BGP MLAG STP SDWAN; do
            echo "::group::Hosted engineering acceptance: ${suite}"
            if python evaluation/heldout/run.py "${suite}"; then
              echo "ENGINEERING_SUITE suite=${suite} result=pass"
            else
              echo "ENGINEERING_SUITE suite=${suite} result=fail"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
