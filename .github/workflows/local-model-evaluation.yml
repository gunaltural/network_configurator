name: Real local model evaluation
on:
  pull_request:
    paths:
      - ".github/workflows/local-model-evaluation.yml"
      - "scripts/evaluate_local_model.py"
      - "engineering_ai.py"
      - "bgp_cli_evidence.py"
      - "start_embedded_ai.py"
      - "Dockerfile"
      - "scripts/check_budget_analysis.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application test dependencies
        run: python -m pip install fastapi httpx httpx2
      - name: Verify official evaluation weights
        run: |
          curl --fail --location --retry 2 --output /tmp/model.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/model.gguf" | sha256sum -c -
      - name: Run local inference with synthetic CLI evidence
        env:
          PYTHONPATH: .
          AI_ENABLED: "1"
          AI_PROVIDER: local
          AI_MODEL: network-engineer
          AI_BASE_URL: http://127.0.0.1:18081/v1
        run: |
          docker pull ghcr.io/ggml-org/llama.cpp:server
          image=$(docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{index .RepoDigests 0}}')
          echo "Runtime: $image"
          docker run -d --name local-inference -p 127.0.0.1:18081:8080 -v /tmp/model.gguf:/models/model.gguf:ro "$image" -m /models/model.gguf --alias network-engineer --host 0.0.0.0 --port 8080 --ctx-size 16384 --parallel 1
          trap 'docker stats --no-stream local-inference; docker rm -f local-inference' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/health
          python scripts/evaluate_local_model.py
      - name: Evaluate app and inference under a shared free-tier-sized budget
        env:
          RUNTIME: ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
        run: |
          set -euo pipefail
          docker build --target app -t nc-budget-app .
          docker network create evaluation
          trap 'docker stats --no-stream nc-app nc-model || true; docker inspect --format "{{.Name}} OOM={{.State.OOMKilled}} exit={{.State.ExitCode}}" nc-app nc-model || true; docker rm -f nc-app nc-model || true; docker network rm evaluation || true' EXIT
          docker run -d --name nc-app --network evaluation --memory 180m --memory-swap 180m --cpus 0.04 -p 127.0.0.1:18100:10000 -e AUTH_ENABLED=0 -e AI_ENABLED=1 -e AI_MODEL=network-engineer -e AI_PROVIDER=local -e AI_BASE_URL=http://nc-model:8080/v1 nc-budget-app
          docker run -d --name nc-model --network evaluation --memory 300m --memory-swap 300m --cpus 0.06 -p 127.0.0.1:18081:8080 -v /tmp/model.gguf:/models/network.gguf:ro "$RUNTIME" -m /models/network.gguf --alias network-engineer --host 0.0.0.0 --port 8080 --ctx-size 16384 --parallel 1
          for i in $(seq 1 100); do
            for container in nc-app nc-model; do
              test "$(docker inspect -f '{{.State.Running}}' "$container")" = true || exit 1
            done
            if curl -fsS --max-time 3 http://127.0.0.1:18100/healthz >/dev/null && curl -fsS --max-time 3 http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:18081/health
          python scripts/check_budget_analysis.py

      - name: Single application image with bundled model, no external provider
        run: |
          docker build -t nc-embedded .
          docker run -d --name combined --memory 480m --memory-swap 480m --cpus 0.1 -p 127.0.0.1:18100:10000 -e AUTH_ENABLED=0 nc-embedded
          trap 'docker stats --no-stream combined; docker inspect --format "OOM={{.State.OOMKilled}} exit={{.State.ExitCode}}" combined; docker rm -f combined' EXIT
          for i in $(seq 1 100); do
            test "$(docker inspect -f '{{.State.Running}}' combined)" = true
            if docker exec combined python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:18081/health',timeout=3)" 2>/dev/null && curl -fsS http://127.0.0.1:18100/healthz >/dev/null; then break; fi
            sleep 2
          done
          python scripts/check_budget_analysis.py
